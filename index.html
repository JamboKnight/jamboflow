
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JamboFlow</title>
    <script defer data-domain="jamboflow.com" src="https://stats.uraj.dev/js/script.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <style>
        body {
            background-color: #fefaf1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #2c2c2c;
            text-align: center;
            padding: 0 20px;
        }
        h1 {
            font-size: 3.8em;
            color: #d4af37; /* Gold */
            margin: 0;
        }
        .accent-line {
            width: 80px;
            height: 6px;
            background: linear-gradient(to right, #ffcc00, #ff0000, #117733);
            margin: 16px 0 24px 0;
            border-radius: 3px;
        }
        p {
            font-size: 1.3em;
            max-width: 600px;
            line-height: 1.6;
            color: #444;
        }
        lottie-player {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <lottie-player
        src="https://assets10.lottiefiles.com/packages/lf20_w51pcehl.json"
        background="transparent"
        speed="1"
        style="width: 200px; height: 200px;"
        loop
        autoplay>
    </lottie-player>
    <h1>Jambo!</h1>
    <div class="accent-line"></div>
    <p>Welcome to the future of workflow clarity—where intelligent design meets seamless execution, and efficiency becomes your new competitive edge.</p>
</body>
</html>
